# Publishes site/ to GitHub Pages.
# Runs on every push, by hand, and daily at 06:17 KST to pull new Tistory columns.
name: deploy-site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new columns from Tistory
        run: python scripts/update_posts.py || echo "RSS fetch failed; keeping current list"
      - name: Refresh column lists and sitemap
        run: python scripts/refresh_columns.py
      - name: Save changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/posts.json site
          if ! git diff --cached --quiet; then
            git commit -m "Update columns from Tistory"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
